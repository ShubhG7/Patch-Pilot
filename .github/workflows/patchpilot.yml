name: PatchPilot

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  patchpilot:
    if: github.event.label.name == 'agent:fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run PatchPilot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          echo "repo=${GITHUB_REPOSITORY}"
          echo "event_path=${GITHUB_EVENT_PATH}"
          python -m agent.main --log-path patchpilot_logs.jsonl

      - name: Print PatchPilot logs (tail)
        if: always()
        run: |
          echo "=== patchpilot_logs.jsonl (tail) ==="
          if [ -f patchpilot_logs.jsonl ]; then
            tail -n 200 patchpilot_logs.jsonl
          else
            echo "No patchpilot_logs.jsonl found"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patchpilot-logs
          path: |
            patchpilot_logs.jsonl

